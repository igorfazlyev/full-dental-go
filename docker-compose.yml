services:
  postgres:
    image: postgres:15-alpine
    container_name: dental_postgres
    environment:
      POSTGRES_USER: dental_user
      POSTGRES_PASSWORD: dental_password
      POSTGRES_DB: dental_marketplace
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - dental_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dental_user -d dental_marketplace"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: dental_app
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: dental_user
      DB_PASSWORD: dental_password
      DB_NAME: dental_marketplace
      JWT_SECRET: your-secret-key-change-in-production
      UPLOAD_PATH: /app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
    networks:
      - dental_network

volumes:
  postgres_data:

networks:
  dental_network:
    driver: bridge
