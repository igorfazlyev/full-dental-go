{{define "content"}}
<div class="container">
    <div class="row justify-content-center" style="min-height: 60vh;">
        <div class="col-md-6 text-center d-flex align-items-center">
            <div class="w-100">
                <i class="bi bi-exclamation-triangle text-danger" style="font-size: 5rem;"></i>
                <h1 class="mt-4">Ошибка</h1>
                <p class="lead text-muted">{{.error}}</p>
                <a href="/" class="btn btn-primary mt-3">
                    <i class="bi bi-house"></i> Вернуться на главную
                </a>
            </div>
        </div>
    </div>
</div>
{{end}}

{{template "layouts/base.html" .}}
